        '503':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
      parameters:
      - name: job_id
        in: path
        required: true
        schema: *id001
      - name: Last-Event-ID
        in: header
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
