openapi: 3.1.0
info:
  title: 知卷原创命题核心业务 API（设计契约）
  version: 1.2.0
  description: '拟开发接口，不是 Hermes 官方 API；不包含已实现服务器。身份系统与管理端接口在实现阶段补充。Schema 跨字段规则以开发文档为准。

    文档 v1.1：DeepSeek 直连 Hermes；Hermes 为唯一 Agent 框架，不引入 LangChain、LangGraph。模型配置属于服务端，不向教师暴露密钥或路由选择。/v1
    路径与既有题目 Schema 保持兼容。'
  x-zhijuan-runtime:
    agent: hermes
    provider: deepseek
    additional-agent-frameworks: []
servers:
- url: http://localhost:8000
  description: 仅本地开发示例，生产必须 HTTPS。
security:
- session: []
paths:
  /v1/capabilities:
    get:
      operationId: listCapabilities
      summary: 查询真实登记的能力
      description: ''
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/exams:
    post:
      operationId: createExam
      summary: 创建试卷草稿
      description: ''
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamSummary'
          headers:
            ETag:
              schema:
                type: string
                minLength: 1
                maxLength: 100
              description: 当前 revision
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamSpec'
  /v1/exams/{exam_id}:
    get:
      operationId: getExam
      summary: 按权限返回学生或教师投影
      description: teacher 视图必须具备读取答案权限；student 响应中不包含 private 字段。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ExamStudentView'
                - $ref: '#/components/schemas/ExamTeacherView'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: exam_id
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
      - name: view
        in: query
        schema:
          type: string
          enum:
          - student
          - teacher
          default: student
